name: Housekeeping
# Small jobs that keep ticket states honest. They run on GitHub's own runners, so they work
# while the Mac's pipeline is off. Called by each project's .github/workflows/housekeeping.yml
# on its schedule, closed pull requests and closed issues; each job checks which it was.
on:
  workflow_call:
    inputs:
      pipeline-ref:
        description: The pipeline version the scripts are taken from; keep it in step with @ in uses
        type: string
        default: v1

env:
  PIPELINE_URL: https://codeload.github.com/GoApps213/pipeline/tar.gz/${{ inputs.pipeline-ref }}

jobs:
  reminders:
    # remind about tickets waiting for an answer; park ones left too long
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Get the pipeline
        run: mkdir -p "$RUNNER_TEMP/p" && curl -fsSL --retry 3 "$PIPELINE_URL" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/p"
      - run: '"$RUNNER_TEMP/p/scripts/reminders.sh"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merged:
    # show the ticket as waiting for its build, even while the Mac's runner is stopped
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'ai/issue-')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Get the pipeline
        run: mkdir -p "$RUNNER_TEMP/p" && curl -fsSL --retry 3 "$PIPELINE_URL" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/p"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          N="${HEAD_REF#ai/issue-}"
          # the release job may already have started; don't put this line after its own
          if gh api "repos/$GITHUB_REPOSITORY/issues/$N" --jq '.labels[].name' \
               | grep -qxE 'ai:(building|released|failed)'; then
            echo "Ticket #$N is already past this point."; exit 0
          fi
          "$RUNNER_TEMP/p/scripts/status.sh" "$N" building "Merged; waiting for the build to start"

  conflicts:
    # a merge can leave other open pull requests conflicting with main: start an agent run
    # to resolve them for each agent PR, and say so on any other
    if: github.event_name == 'pull_request' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: write   # to start the agent's run
    steps:
      - name: Get the pipeline
        run: mkdir -p "$RUNNER_TEMP/p" && curl -fsSL --retry 3 "$PIPELINE_URL" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/p"
      - run: '"$RUNNER_TEMP/p/scripts/conflicts.sh" "$MERGED"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED: ${{ github.event.pull_request.number }}

  closed-without-merging:
    # an agent PR closed without merging would otherwise leave its ticket "in review"
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'ai/issue-')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Get the pipeline
        run: mkdir -p "$RUNNER_TEMP/p" && curl -fsSL --retry 3 "$PIPELINE_URL" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/p"
      - run: '"$RUNNER_TEMP/p/scripts/status.sh" "${HEAD_REF#ai/issue-}" failed "Pull request closed without merging"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

  cancelled:
    # a ticket closed as "not planned", from the app or on GitHub, is cancelled: stop its
    # agent run, close its pull request and mark it. A merged PR closes its ticket as
    # "completed", so that never lands here.
    if: >-
      github.event_name == 'issues' && github.event.issue.state_reason == 'not_planned' &&
      (contains(github.event.issue.labels.*.name, 'ai-request') ||
       contains(github.event.issue.labels.*.name, 'ai-approved'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      actions: write   # to cancel the agent's run
    steps:
      - name: Get the pipeline
        run: mkdir -p "$RUNNER_TEMP/p" && curl -fsSL --retry 3 "$PIPELINE_URL" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/p"
      - run: '"$RUNNER_TEMP/p/scripts/cancel.sh" "$N"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ github.event.issue.number }}
