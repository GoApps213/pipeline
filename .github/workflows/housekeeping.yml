name: Housekeeping
# Small jobs that keep ticket states honest. They run on GitHub's own runners,
# so they work while the Mac's pipeline is off.
on:
  schedule:
    - cron: "0 16 * * *"   # daily
  pull_request:
    types: [closed]
  issues:
    types: [closed]
  workflow_dispatch:

jobs:
  reminders:
    # remind about tickets waiting for an answer; park ones left too long
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/reminders.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merged:
    # show the ticket as waiting for its build, even while the Mac's runner is stopped
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'ai/issue-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # run the scripts from main, not from the merged branch
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          N="${HEAD_REF#ai/issue-}"
          # the release job may already have started; don't put this line after its own
          if gh api "repos/$GITHUB_REPOSITORY/issues/$N" --jq '.labels[].name' \
               | grep -qxE 'ai:(building|released|failed)'; then
            echo "Ticket #$N is already past this point."; exit 0
          fi
          scripts/status.sh "$N" building "Merged; waiting for the build to start"

  closed-without-merging:
    # an agent PR closed without merging would otherwise leave its ticket "in review"
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'ai/issue-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # run the scripts from main, not from the closed branch
      - run: scripts/status.sh "${HEAD_REF#ai/issue-}" failed "Pull request closed without merging"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

  cancelled:
    # a ticket closed as "not planned", from the app or on GitHub, is cancelled: stop its
    # agent run, close its pull request and mark it. A merged PR closes its ticket as
    # "completed", so that never lands here.
    if: >-
      github.event_name == 'issues' && github.event.issue.state_reason == 'not_planned' &&
      (contains(github.event.issue.labels.*.name, 'ai-request') ||
       contains(github.event.issue.labels.*.name, 'ai-approved'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write   # to cancel the agent's run
    steps:
      - uses: actions/checkout@v4
      - run: scripts/cancel.sh "$N"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ github.event.issue.number }}
