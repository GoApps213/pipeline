name: Agent
# Called by each project's .github/workflows/agent.yml, which decides whether a label or a
# comment starts a run and grants the permissions. See templates/workflows/agent.yml.
on:
  workflow_call:
    inputs:
      pipeline-owner:
        description: The person whose labels and comments start runs; asked to review each PR
        type: string
        required: true
      pr-number:
        description: For a run started by housekeeping's conflicts job, the pull request whose conflicts with main to resolve
        type: string
        default: ""
      pipeline-ref:
        description: The pipeline version the scripts are taken from; keep it in step with @ in uses
        type: string
        default: v1

jobs:
  run:
    runs-on: [self-hosted, macOS]
    # Two full verification runs of an app with UI tests take about half an hour on their own
    timeout-minutes: 90
    steps:
      # Outside the project's checkout, so the agent's working tree never holds the pipeline
      - name: Get the pipeline
        env:
          REF: ${{ inputs.pipeline-ref }}
        run: |
          rm -rf "$RUNNER_TEMP/pipeline" && mkdir -p "$RUNNER_TEMP/pipeline"
          curl -fsSL --retry 3 "https://codeload.github.com/GoApps213/pipeline/tar.gz/$REF" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/pipeline"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # the token is not left in .git/config, so the agent can't read it
          persist-credentials: false
      # exec, so the runner's cancel signal goes to the script and not to a shell around it.
      # The script then stops the agent or the build it is waiting for (scripts/steps.sh).
      - run: exec "$RUNNER_TEMP/pipeline/scripts/agent-run.sh"
        env:
          PIPELINE_DIR: ${{ runner.temp }}/pipeline
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          PR_NUMBER: ${{ inputs.pr-number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          TRIGGER: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTACHMENTS_TOKEN: ${{ secrets.ATTACHMENTS_TOKEN }}
          PIPELINE_OWNER: ${{ inputs.pipeline-owner }}
      # The job hit its time limit or was cancelled on GitHub: say so on the ticket, which
      # would otherwise stay on "running". A ticket that was closed is left to scripts/cancel.sh.
      # The status script comes from the pipeline download, never from the checkout, which
      # may hold files the agent changed while this step has the token.
      - name: Mark the ticket as stopped
        if: cancelled()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          PR_NUMBER: ${{ inputs.pr-number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GH_REPO="$GITHUB_REPOSITORY"
          STATUS="$RUNNER_TEMP/pipeline/scripts/status.sh"
          [ -x "$STATUS" ] || { echo "Cancelled before the pipeline was downloaded."; exit 0; }
          n="$ISSUE_NUMBER"
          if [ -n "$PR_NUMBER" ]; then
            head=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
            case "$head" in
              ai/issue-*) n="${head#ai/issue-}" ;;
              *) exit 0 ;;
            esac
          fi
          ticket=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" \
            --jq '[.state, ([.labels[].name] | join(","))] | @tsv')
          case "$ticket," in
            open*ai:running,*) ;;
            *) echo "Ticket #$n is not open and running; leaving its status alone."; exit 0 ;;
          esac
          "$STATUS" "$n" failed "Run stopped before it finished: it reached the time limit or was cancelled"
