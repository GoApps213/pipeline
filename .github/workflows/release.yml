name: Release
# Builds the project and uploads it to TestFlight, with progress lines on the tickets the
# build contains. Called by each project's .github/workflows/release.yml, which sets when it
# runs and grants the permissions. The project's .agent/project.json names what to build, and
# its `release` environment holds the signing and App Store Connect secrets.
on:
  workflow_call:
    inputs:
      pipeline-ref:
        description: The pipeline version the scripts are taken from; keep it in step with @ in uses
        type: string
        default: v1

jobs:
  testflight:
    runs-on: [self-hosted, macOS]
    environment: release
    steps:
      # Agent runs use this same folder on the runner, and git hooks and .git/config
      # survive a checkout. Start from a fresh clone so nothing left by an agent run
      # executes in the job that holds the secrets.
      - name: Remove the git state left in the workspace
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-contents.sh reads the history since the last build

      - name: Get the pipeline
        env:
          REF: ${{ inputs.pipeline-ref }}
        run: |
          rm -rf "$RUNNER_TEMP/pipeline" && mkdir -p "$RUNNER_TEMP/pipeline"
          curl -fsSL --retry 3 "https://codeload.github.com/GoApps213/pipeline/tar.gz/$REF" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/pipeline"

      - name: Work out what this build contains
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TICKETS=$("$RUNNER_TEMP/pipeline/scripts/build-contents.sh")
          for n in $TICKETS; do "$RUNNER_TEMP/pipeline/scripts/status.sh" "$n" building "Build started"; done

      - name: Build and upload
        working-directory: ${{ runner.temp }}/pipeline   # where the shared fastlane/Fastfile is
        env:
          PROJECT_DIR: ${{ github.workspace }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # built into an app that has TicketKit; empty for one without it
          TICKETKIT_GITHUB_TOKEN: ${{ secrets.TICKETKIT_GITHUB_TOKEN }}
          # lets the lane add progress lines to the tickets in this build
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: fastlane beta

      - name: Mark the tickets released
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export BUILD_NUMBER=$(cat .build-number)
          for n in $TICKETS; do "$RUNNER_TEMP/pipeline/scripts/status.sh" "$n" released "On TestFlight (build $BUILD_NUMBER)"; done
          # and any left "building" by a release this one replaced
          "$RUNNER_TEMP/pipeline/scripts/released.sh" "$GITHUB_SHA"

      - name: Mark the tickets failed
        if: failure() && env.TICKETS != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: for n in $TICKETS; do "$RUNNER_TEMP/pipeline/scripts/status.sh" "$n" failed "Release build failed; see the Actions log"; done
